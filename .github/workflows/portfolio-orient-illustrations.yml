name: Correct orientation of verified illustration photographs
on:
  push:
    branches:
      - portfolio-editorial-material-review-2026-11-13
    paths:
      - '.github/workflows/portfolio-orient-illustrations.yml'
permissions:
  contents: write
jobs:
  correct:
    name: Generate upright copies and update My Story without altering originals
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-editorial-material-review-2026-11-13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Preserve originals and orient verified illustrations
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('portfolio-dev')
          source=root/'incoming-portfolio-2026-11-15'
          dest=root/'oriented'
          dest.mkdir(exist_ok=True)
          corrections={
            'illustration_covid19_drawing.png':90,
            'illustration_character_inked_detail.png':-90,
            'illustration_character_sketch_construction.png':-90,
          }
          page=root/'profile.html'
          html=page.read_text(encoding='utf8')
          for name,angle in corrections.items():
            before='incoming-portfolio-2026-11-15/'+name
            after='oriented/'+name
            if html.count(before)!=2:raise RuntimeError('Expected two href/src uses for '+name)
            with Image.open(source/name) as original:
              upright=original.rotate(angle,expand=True)
              upright.save(dest/name,format='PNG',optimize=True)
              print(name,original.size,'->',upright.size,'angle',angle)
            html=html.replace(before,after)
          page.write_text(html,encoding='utf8')
          PY
      - name: Commit corrected copies to development branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-dev/profile.html portfolio-dev/oriented/
          git diff --cached --check
          git commit -m "Display three illustration originals upright; preserve raw uploads"
          git push origin HEAD:portfolio-editorial-material-review-2026-11-13
