name: Portfolio final editorial candidate QA (non-public)
on:
  push:
    branches:
      - portfolio-release-candidate-review-2026-11-13
    paths:
      - .github/workflows/portfolio-release-candidate-qa.yml
permissions:
  contents: write
jobs:
  browser:
    name: Final candidate browser and editorial regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        run: |
          npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Serve source candidate, no deployment
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/portfolio-dev/index.html > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1
      - name: Responsive image and interaction browser smoke
        id: smoke
        continue-on-error: true
        run: node portfolio-dev/tests/browser-smoke.cjs
      - name: Desktop and mobile accessibility audit
        id: axe
        continue-on-error: true
        run: node portfolio-dev/tests/accessibility-audit.cjs
      - name: Targeted technical-story verification
        id: story
        continue-on-error: true
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [1440,375]){
              const page=await browser.newPage({viewport:{width,height:900}});
              await page.goto('http://127.0.0.1:8765/portfolio-dev/profile.html');
              await page.locator('.technical-practice-detail').waitFor();
              const target=page.locator('.technical-practice-detail');
              const layout=await target.evaluate(e=>{const r=e.getBoundingClientRect();return {w:r.width,h:r.height,scroll:e.scrollWidth,client:e.clientWidth}});
              if(!layout.h || layout.scroll>layout.client+3)throw Error('Technical story overflow: '+JSON.stringify({width,...layout}));
              const txt=await page.locator('.career-history').innerText();
              for(const term of ['B-2','Inconel','titanium','FAA','MIG','TIG','composites']){
                if(!txt.includes(term))throw Error('Missing career evidence '+term+' at '+width);
              }
              await page.goto('http://127.0.0.1:8765/portfolio-dev/production.html');
              const story=await page.locator('.process-story').innerText();
              if(!story.includes('RIP')||!story.includes('ICC'))throw Error('Missing RIP ICC production workflow');
              await page.goto('http://127.0.0.1:8765/portfolio-dev/index.html');
              const photo=page.locator('.hero-lead img');
              await photo.evaluate(async e=>{if(!e.complete)await new Promise(r=>e.addEventListener('load',r,{once:true}));});
              const metrics=await photo.evaluate(e=>{let r=e.getBoundingClientRect();return {visible:r.width>140&&r.height>100,loaded:e.naturalWidth>0,width:r.width,height:r.height}});
              if(!metrics.visible||!metrics.loaded)throw Error('Hero lead not visible: '+JSON.stringify(metrics));
              console.log('PASS editorial and hero regressions at '+width+'px');
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Preserve complete visual screenshots for owner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-final-editorial-review
          path: portfolio-dev/browser-qa/
          retention-days: 14
          if-no-files-found: warn

# Final review-only QA trigger, no deployment.

# Post-editorial visual workflow verification.

      - name: Record final QA result on isolated branch
        if: always()
        env:
          SMOKE: ${{ steps.smoke.outcome }}
          AXE: ${{ steps.axe.outcome }}
          STORY: ${{ steps.story.outcome }}
          TESTED_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '# Final editorial review candidate browser QA'
            echo
            echo "- Tested commit: \`$TESTED_COMMIT\`"
            echo "- Responsive/images: **$SMOKE**"
            echo "- Accessibility: **$AXE**"
            echo "- Aerospace/RIP/ICC/hero assertions: **$STORY**"
            echo "- Run: $RUN_URL"
            echo '- Non-public development candidate; no deployment.'
          } > portfolio-dev/FINAL_EDITORIAL_QA_RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-dev/FINAL_EDITORIAL_QA_RESULT.md
          git commit -m "Record final editorial candidate QA results" || true
          git push origin HEAD:portfolio-release-candidate-review-2026-11-13
      - name: Fail if a quality gate failed
        if: steps.smoke.outcome != 'success' || steps.axe.outcome != 'success' || steps.story.outcome != 'success'
        run: exit 1

# Final no-wrap micro-polish verification.
