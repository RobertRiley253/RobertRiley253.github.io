name: Portfolio homepage photographic curation QA — review only
on:
  push:
    branches: [portfolio-homepage-curation-review-2026-11-13]
    paths: [.github/workflows/portfolio-homepage-curation-qa.yml]
permissions:
  contents: write
jobs:
  browser:
    name: Original-photo homepage and responsive review (no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/portfolio-dev/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1
      - name: Full responsive, photo-decode and zoom checks
        id: smoke
        continue-on-error: true
        run: node portfolio-dev/tests/browser-smoke.cjs
      - name: Automated accessibility audit
        id: axe
        continue-on-error: true
        run: node portfolio-dev/tests/accessibility-audit.cjs
      - name: Homepage photo diversity and original-hero checks
        id: curation
        continue-on-error: true
        run: |
          node <<'JS'
          const fs=require('fs'),{chromium}=require('playwright');
          (async()=>{
            const html=fs.readFileSync('portfolio-dev/index.html','utf8');
            const ids=[...html.matchAll(/<img[^>]*src="https:\/\/robertriley253.github.io\/portfolio-(\d+)\.jpg"[^>]*>/g)].map(m=>m[1]);
            if(ids.length!==new Set(ids).size)throw Error('Repeated original JPEGs in homepage');
            const {chromium}=require('playwright'),browser=await chromium.launch({headless:true});
            for(const width of [1440,375]){
              const page=await browser.newPage({viewport:{width,height:900}});
              await page.goto('http://127.0.0.1:8765/portfolio-dev/index.html');
              const imgs=page.locator('.hero-composition img');
              const src=await imgs.evaluateAll(es=>es.map(e=>e.getAttribute('src')));
              for(const original of ['portfolio-006.jpg','portfolio-009.jpg','portfolio-023.jpg'])if(!src.some(s=>s.includes(original)))throw Error('Approved opening image missing: '+original);
              const hero=page.locator('.hero-lead img');
              const visible=await hero.evaluate(e=>{const r=e.getBoundingClientRect();return e.naturalWidth>0&&r.height>100&&r.width>100});
              if(!visible)throw Error('Hero lead invisible on '+width);
              console.log('PASS curated homepage '+width+'px with '+ids.length+' non-repeated original JPEG placements');
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Store screenshots for photographic editor review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-curated-homepage-visual-review
          path: portfolio-dev/browser-qa/
          if-no-files-found: warn
          retention-days: 14
      - name: Record test results without publication
        if: always()
        env:
          SMOKE: ${{ steps.smoke.outcome }}
          AXE: ${{ steps.axe.outcome }}
          CURATION: ${{ steps.curation.outcome }}
          TESTED_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '# Curated homepage QA — private review'
            echo
            echo "- Tested commit: \`$TESTED_COMMIT\`"
            echo "- Responsive and photos: **$SMOKE**"
            echo "- Accessibility: **$AXE**"
            echo "- Curated photo uniqueness and hero: **$CURATION**"
            echo "- Run: $RUN_URL"
            echo '- Review branch only. No publication.'
          } > portfolio-dev/HOMEPAGE_CURATION_QA_RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-dev/HOMEPAGE_CURATION_QA_RESULT.md
          git commit -m "Record curated homepage browser QA results" || true
          git push origin HEAD:portfolio-homepage-curation-review-2026-11-13
      - name: Mark failed checks
        if: steps.smoke.outcome != 'success' || steps.axe.outcome != 'success' || steps.curation.outcome != 'success'
        run: exit 1
