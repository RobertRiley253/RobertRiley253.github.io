name: Atelier final art-direction browser review — development only
on:
  push:
    branches: [portfolio-atelier-art-direction-review-2026-11-13]
    paths: [.github/workflows/portfolio-atelier-visual-qa.yml]
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and browser validation tools
        run: |
          npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Start local-only review server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/portfolio-dev/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1
      - name: Full four-page image and responsive QA
        id: smoke
        continue-on-error: true
        run: node portfolio-dev/tests/browser-smoke.cjs
      - name: All four pages accessibility audit
        id: axe
        continue-on-error: true
        run: node portfolio-dev/tests/accessibility-audit.cjs
      - name: Editorial framing and mobile overflow checks
        id: layout
        continue-on-error: true
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [375,768,1440]){
              for(const file of ['index','work','production','profile']){
                const page=await browser.newPage({viewport:{width,height:900}});
                await page.goto('http://127.0.0.1:8765/portfolio-dev/'+file+'.html',{waitUntil:'domcontentloaded'});
                await page.locator('body').evaluate(()=>document.fonts.ready);
                const facts=await page.evaluate(()=>{
                  const root=document.documentElement;
                  const s=document.querySelector('link[href="atelier-art-direction.css"]');
                  let body=document.body;
                  let images=[...document.querySelectorAll('img')].filter(x=>x.naturalWidth===0&&x.complete);
                  return {overflow:root.scrollWidth-root.clientWidth,stylesheet:!!s,broken:images.length,chapters:document.querySelectorAll('.chapter').length}
                });
                if(!facts.stylesheet)throw Error('Atelier CSS absent '+file);
                if(facts.overflow>4)throw Error('Horizontal overflow '+width+' '+file+': '+JSON.stringify(facts));
                console.log('PASS editorial layout '+file+' '+width+'px '+JSON.stringify(facts));
                await page.close();
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)})
          JS
      - name: Save actual visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-four-page-desktop-mobile-review
          path: portfolio-dev/browser-qa/
          if-no-files-found: warn
          retention-days: 14
      - name: Record QA report on review branch
        if: always()
        env:
          SMOKE: ${{ steps.smoke.outcome }}
          AXE: ${{ steps.axe.outcome }}
          LAYOUT: ${{ steps.layout.outcome }}
          TESTED_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '# Signmaker Atelier visual QA — development candidate'
            echo
            echo "- Tested commit: \`$TESTED_COMMIT\`"
            echo "- Responsive and photos: **$SMOKE**"
            echo "- Accessibility: **$AXE**"
            echo "- Editorial layout and horizontal overflow: **$LAYOUT**"
            echo "- Run: $RUN_URL"
            echo '- Review branch, not published.'
          } > portfolio-dev/ATELIER_ART_DIRECTION_QA.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-dev/ATELIER_ART_DIRECTION_QA.md
          git commit -m "Record atelier art direction QA" || true
          git push origin HEAD:portfolio-atelier-art-direction-review-2026-11-13
      - name: Enforce test failures
        if: steps.smoke.outcome != 'success' || steps.axe.outcome != 'success' || steps.layout.outcome != 'success'
        run: exit 1
