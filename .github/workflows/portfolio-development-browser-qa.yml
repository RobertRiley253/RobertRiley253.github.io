name: Portfolio development browser QA
on:
  push:
    branches:
      - portfolio-development-2026-11-12
    paths:
      - "portfolio-dev/**"
      - ".github/workflows/portfolio-development-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    name: Chromium responsive smoke tests (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve checked-out development files locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/portfolio-dev/index.html > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1
      - name: Test four pages at desktop and mobile widths
        run: node portfolio-dev/tests/browser-smoke.cjs
      - name: Save screenshots and report (development review only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-development-browser-qa
          path: portfolio-dev/browser-qa/
          if-no-files-found: warn
          retention-days: 14
