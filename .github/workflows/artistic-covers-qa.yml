name: Rich artistic covers and full four-page final visual QA
on:
  push:
    branches: [portfolio-artistic-covers-complete-review-2026-11-13]
    paths: [.github/workflows/artistic-covers-qa.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare browser
        run: |
          npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Start development-only local server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:8765/portfolio-dev/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/portfolio-http.log; exit 1
      - name: Existing photo and responsive regression suite
        id: smoke
        continue-on-error: true
        run: node portfolio-dev/tests/browser-smoke.cjs
      - name: Accessibility audit
        id: axe
        continue-on-error: true
        run: node portfolio-dev/tests/accessibility-audit.cjs
      - name: New actual covers and visual composition
        id: art
        continue-on-error: true
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const br=await chromium.launch({headless:true});
            const files=['index','work','production','profile'];
            for(const width of [375,768,1024,1440]){
              for(const f of files){
                const p=await br.newPage({viewport:{width,height:900},deviceScaleFactor:1});
                await p.goto('http://127.0.0.1:8765/portfolio-dev/'+f+'.html',{waitUntil:'domcontentloaded'});
                await p.waitForTimeout(650);
                const state=await p.evaluate(()=>({
                  viewport:document.documentElement.clientWidth,
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  cover:document.querySelector('.atelier-cover')?.getBoundingClientRect().height||0,
                  photos:document.querySelectorAll('.atelier-cover-photo img').length,
                  css:!!document.querySelector('link[href="artistic-covers.css"]'),
                  noindex:document.querySelector('meta[name="robots"]')?.content==='noindex,nofollow',
                  painted:getComputedStyle(document.querySelector('.atelier-cover')||document.body).backgroundImage
                }));
                if(!state.css||!state.noindex||state.overflow>4)throw Error('Layout failure '+f+' at '+width+' '+JSON.stringify(state));
                if(f!=='index'&&(state.cover<400||state.photos!==3||state.painted==='none'))throw Error('Cover incomplete '+f+' '+width+' '+JSON.stringify(state));
                if(f!=='index'&&width===1440)await p.screenshot({path:'portfolio-dev/browser-qa/'+f+'-art-cover.png',fullPage:false,animations:'disabled'});
                if(f==='index'&&width===1440)await p.screenshot({path:'portfolio-dev/browser-qa/index-art-cover.png',fullPage:false,animations:'disabled'});
                if(width===375)await p.screenshot({path:'portfolio-dev/browser-qa/'+f+'-art-mobile.png',fullPage:false,animations:'disabled'});
                console.log('PASS ART '+f+' '+width+'px '+JSON.stringify(state));
                await p.close();
              }
            }
            await br.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Preserve actual four-page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robert-riley-artistically-designed-four-pages
          path: portfolio-dev/browser-qa/
          retention-days: 14
          if-no-files-found: warn
      - name: Record verification, no publication
        if: always()
        env:
          SMOKE: ${{ steps.smoke.outcome }}
          AXE: ${{ steps.axe.outcome }}
          ART: ${{ steps.art.outcome }}
          COMMIT: ${{ github.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '# Artistic-cover final visual quality checks'
            echo
            echo "- Tested commit: \`$COMMIT\`"
            echo "- Browser photos/responsive: **$SMOKE**"
            echo "- Accessibility: **$AXE**"
            echo "- New cover art and viewport overflow: **$ART**"
            echo "- Full screenshots in run artifact: $URL"
            echo '- No merge. No deployment.'
          } > portfolio-dev/ARTISTIC_COVERS_QA.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-dev/ARTISTIC_COVERS_QA.md
          git commit -m "Record artistic-covers visual QA" || true
          git push origin HEAD:portfolio-artistic-covers-complete-review-2026-11-13
      - name: Enforce checks
        if: steps.smoke.outcome != 'success' || steps.axe.outcome != 'success' || steps.art.outcome != 'success'
        run: exit 1

