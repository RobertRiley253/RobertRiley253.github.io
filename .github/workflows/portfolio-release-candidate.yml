name: Portfolio nonpublishing release candidate
on:
  workflow_dispatch:
  push:
    branches:
      - portfolio-editorial-material-review-2026-11-13
    paths:
      - 'portfolio-dev/**'
      - 'incoming-portfolio/**'
      - 'Rob-Photo-Uploads/**'
      - '.github/workflows/portfolio-release-candidate.yml'
permissions:
  contents: read
jobs:
  prepare:
    name: Assemble full website and verify image dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assemble protected candidate; do not touch main
        run: node portfolio-dev/tests/prepare-release-candidate.cjs
      - name: Verify all four pages and local server responses
        run: |
          python3 -m http.server 8877 --bind 127.0.0.1 --directory release-candidate >/tmp/release-server.log 2>&1 &
          for page in index.html work.html production.html profile.html; do
            for attempt in 1 2 3 4 5; do
              if curl -fsS "http://127.0.0.1:8877/$page" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:8877/$page" >/dev/null
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium Firefox and Safari WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Browser-test actual publication candidate before approval
        env:
          PORTFOLIO_TEST_URL: http://127.0.0.1:8877/
        run: node portfolio-dev/tests/cross-browser-release.cjs
      - name: Decode complete galleries inside the actual release package
        env:
          PORTFOLIO_TEST_URL: http://127.0.0.1:8877/
        run: node portfolio-dev/tests/deep-gallery-integrity.cjs
      - name: Verify true touch-enabled iPhone and Android emulation
        env:
          PORTFOLIO_TEST_URL: http://127.0.0.1:8877/
        run: node portfolio-dev/tests/touch-device-release.cjs
      - name: Preserve screenshots of publication candidate for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robert-riley-release-candidate-screenshots
          path: portfolio-dev/browser-qa/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve publication candidate for owner's review (not published)
        uses: actions/upload-artifact@v4
        with:
          name: robert-riley-unpublished-release-candidate
          path: release-candidate/
          retention-days: 14
          compression-level: 6
