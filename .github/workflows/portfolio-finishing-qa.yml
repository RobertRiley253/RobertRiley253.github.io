name: Portfolio finishing browser QA (development only)
on:
  push:
    branches:
      - portfolio-final-finishing-2026-11-13
    paths:
      - .github/workflows/portfolio-finishing-qa.yml

permissions:
  contents: write

jobs:
  finishing-qa:
    name: Chromium finishing verification (no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Serve development files only
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/portfolio-dev/index.html > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1
      - name: Test browser pages photos and zoom
        id: browser
        continue-on-error: true
        run: node portfolio-dev/tests/browser-smoke.cjs
      - name: Test automated accessibility
        id: accessibility
        continue-on-error: true
        run: node portfolio-dev/tests/accessibility-audit.cjs
      - name: Preserve QA screenshots for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-final-finishing-browser-review
          path: portfolio-dev/browser-qa/
          if-no-files-found: warn
          retention-days: 14
      - name: Record QA result without publication
        if: always()
        env:
          BROWSER_STATUS: ${{ steps.browser.outcome }}
          ACCESS_STATUS: ${{ steps.accessibility.outcome }}
          TESTED_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '# Finishing browser QA — automatic results'
            echo
            echo "- Tested commit: \`$TESTED_COMMIT\`"
            echo "- Browser smoke: **$BROWSER_STATUS**"
            echo "- Accessibility scan: **$ACCESS_STATUS**"
            echo "- Run: $RUN_URL"
            echo '- Scope: isolated finishing branch, no publication or main branch changes.'
          } > portfolio-dev/FINISHING_BROWSER_QA_RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-dev/FINISHING_BROWSER_QA_RESULT.md
          git commit -m "Record isolated finishing browser QA results" || true
          git push origin HEAD:portfolio-final-finishing-2026-11-13
      - name: Mark failed checks
        if: steps.browser.outcome != 'success' || steps.accessibility.outcome != 'success'
        run: exit 1
